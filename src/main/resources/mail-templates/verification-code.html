<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>账号验证</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f1f5f9; padding: 40px 16px;">
    <tr>
        <td align="center">
            <!-- 主容器 -->
            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 520px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06); border: 1px solid #e2e8f0;">

                <!-- 顶部标题 -->
                <tr>
                    <td align="center" style="padding: 36px 32px 24px; background-color: #ffffff;">
                        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px;" th:text="${appName != null ? appName : '账号注册验证'}">账号注册验证</h1>
                    </td>
                </tr>

                <!-- 分割线 -->
                <tr>
                    <td style="padding: 0 32px;">
                        <div style="height: 1px; background-color: #f1f5f9; width: 100%;"></div>
                    </td>
                </tr>

                <!-- 正文内容 -->
                <tr>
                    <td style="padding: 32px 32px 24px;">
                        <p style="margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #334155;">
                            您好 <strong th:text="${username}">用户</strong>，
                        </p>
                        <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #64748b;">
                            感谢注册我们的服务。请使用下方的验证码完成账号验证，该验证码在 <strong style="color: #334155;"><span th:text="${expireMinutes}">10</span> 分钟</strong> 内有效：
                        </p>

                        <!-- 验证码展示区域 -->
                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 8px 0 24px;">
                            <tr>
                                <td align="center" style="padding: 20px; background-color: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px;">
                                    <span style="font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 32px; font-weight: 700; color: #2563eb; letter-spacing: 8px; margin-left: 8px;" th:text="${code}">123456</span>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 0 0 12px; font-size: 13px; line-height: 1.6; color: #94a3b8;">
                            若您未发起此操作或未尝试注册该账号，请直接忽略本邮件。
                        </p>
                    </td>
                </tr>

                <!-- 页脚 -->
                <tr>
                    <td align="center" style="padding: 24px 32px; background-color: #f8fafc; border-top: 1px solid #e2e8f0;">
                        <p style="margin: 0 0 6px; font-size: 12px; line-height: 1.4; color: #94a3b8;">
                            此邮件为系统自动发送，请勿直接回复。
                        </p>
                        <p style="margin: 0; font-size: 12px; color: #cbd5e1;">
                            &copy; <span th:text="${#calendars.year(#calendars.createNow())}">2026</span> <span>阿萨拉向导</span>. 保留所有权利。
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
